<form class="{{cssClass}} flexcol kbm-window theme-{{theme}}" autocomplete="off" style="padding: 15px; height: 100%;">
    <header class="sheet-header" style="margin-bottom: 15px; flex: 0 0 auto;">
        <div style="display: flex; flex-direction: row; gap: 15px; width: 100%; align-items: center;">
            <div style="flex: 0 0 85px; width: 85px; height: 85px; border: 2px solid var(--kbm-border); border-radius: 5px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.05);">
                <img class="profile-img" src="{{item.img}}" data-edit="img" title="{{item.name}}" style="width: 100%; height: 100%; object-fit: cover; border: none !important; transform: scale(1.2); cursor: pointer; margin: 0; padding: 0;"/>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0;">
                <h1 class="charname" style="margin: 0; padding-bottom: 5px; border-bottom: 2px solid; display: flex; align-items: center; width: 100%; min-width: 0;">
                    <span style="background: var(--kbm-border); color: var(--kbm-bg-color); border-radius: 50%; width: 24px; height: 24px; display: inline-flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; margin-right: 10px; flex: 0 0 24px;">{{safeLevel}}</span>
                    <input name="name" type="text" value="{{docName}}" placeholder="{{localize 'KEXBORN.UI.Placeholders.StructureName'}}" style="flex: 1; font-size: 28px; background: transparent; border: none; margin: 0; padding: 0; min-width: 0;"/>
                </h1>
                
                <div style="display: flex; flex-direction: row; align-items: center; gap: 15px; margin-top: 8px; width: 100%;">
                    <div style="display: flex; align-items: center; gap: 5px; flex: 1;">
                        <label style="font-weight: bold; font-size: 12px; text-transform: uppercase;">{{localize 'KEXBORN.UI.Genre'}}:</label>
                        <select name="system.genre" style="width: 100%; border: 1px solid; border-radius: 3px; padding: 2px; background: transparent;">
                            {{selectOptions availableGenres selected=safeGenre}}
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 5px; flex: 1;">
                        <label style="font-weight: bold; font-size: 12px; text-transform: uppercase;">{{localize 'KEXBORN.UI.Category'}}:</label>
                        <select name="system.category" style="width: 100%; border: 1px solid; border-radius: 3px; padding: 2px; background: transparent;">
                            {{selectOptions availableCategories selected=safeCategory}}
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <label style="font-weight: bold; font-size: 12px; text-transform: uppercase;" title="{{localize 'KEXBORN.UI.Tooltips.PriorityHint'}}">{{localize 'KEXBORN.UI.Priority'}}:</label>
                        <input type="number" name="system.priority" value="{{system.priority}}" style="width: 50px; border: 1px solid; border-radius: 3px; padding: 2px; text-align: center; background: transparent; font-weight: bold;"/>
                    </div>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <label style="font-weight: bold; font-size: 12px; text-transform: uppercase;">{{localize 'KEXBORN.UI.LevelNormal'}}:</label>
                        <select name="system.level" style="border: 1px solid; border-radius: 3px; padding: 2px; text-align: center; background: transparent;">
                            {{selectOptions levels selected=safeLevel}}
                        </select>
                    </div>
                </div>
                
                <div style="display: flex; flex-direction: row; align-items: center; gap: 10px; margin-top: 10px; border-top: 1px dashed var(--kbm-border-subtle); padding-top: 10px;">
                    <label style="font-weight: bold; font-size: 10px; text-transform: uppercase; color: var(--kbm-text-muted); flex: 0 0 auto; line-height: 1.1; max-width: 120px;">
                        {{localize 'KEXBORN.UI.RequiredStructures'}}
                    </label>
                    <div style="display: flex; gap: 8px; flex: 1;">
                        <input type="text" name="system.prerequisites.0" value="{{system.prerequisites.[0]}}" placeholder="{{localize 'KEXBORN.UI.Placeholders.Link1'}}" style="flex: 1; border: 1px solid var(--kbm-border-subtle); border-radius: 3px; background: rgba(0,0,0,0.05); padding: 4px; font-size: 13px; font-family: var(--kbm-font-body); width: 100%;"/>
                        <input type="text" name="system.prerequisites.1" value="{{system.prerequisites.[1]}}" placeholder="{{localize 'KEXBORN.UI.Placeholders.Link2'}}" style="flex: 1; border: 1px solid var(--kbm-border-subtle); border-radius: 3px; background: rgba(0,0,0,0.05); padding: 4px; font-size: 13px; font-family: var(--kbm-font-body); width: 100%;"/>
                        <input type="text" name="system.prerequisites.2" value="{{system.prerequisites.[2]}}" placeholder="{{localize 'KEXBORN.UI.Placeholders.Link3'}}" style="flex: 1; border: 1px solid var(--kbm-border-subtle); border-radius: 3px; background: rgba(0,0,0,0.05); padding: 4px; font-size: 13px; font-family: var(--kbm-font-body); width: 100%;"/>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <nav class="sheet-tabs tabs" data-group="primary" style="display: flex; justify-content: space-around; margin-bottom: 15px; font-weight: bold; border-bottom: 2px solid; font-size: 20px; flex: 0 0 auto;">
        <a class="item" data-tab="description" style="flex: 1; text-align: center;">{{localize 'KEXBORN.Tabs.Description'}}</a>
        <a class="item" data-tab="bonuses" style="flex: 1; text-align: center;">{{localize 'KEXBORN.Tabs.Bonuses'}}</a>
    </nav>
    <section class="sheet-body" style="flex: 1; overflow-y: auto; padding-right: 5px;">
        <div class="tab description" data-group="primary" data-tab="description" style="height: 100%;">
            <div class="prose-editor-container" style="height: 100%;">
                {{editor enrichedDescription target="system.description" button=true editable=editable engine="prosemirror" collaborate=false}}
            </div>
        </div>
        <div class="tab bonuses" data-group="primary" data-tab="bonuses">
            <p style="font-style: italic; font-size: 13px; margin-bottom: 20px;">{{localize 'KEXBORN.UI.Notes.BonusesHint'}}</p>
            <div style="display: flex; justify-content: space-between; padding: 0 10px;">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                    <label style="font-weight: bold; font-size: 14px; text-transform: uppercase;">{{localize 'KEXBORN.Stats.Army'}}</label>
                    <input type="number" name="system.bonuses.army" value="{{safeBonuses.army}}" style="width: 50px; height: 30px; text-align: center; font-weight: bold; font-size: 18px; border: 1px solid; background: transparent; border-radius: 3px;"/>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                    <label style="font-weight: bold; font-size: 14px; text-transform: uppercase;">{{localize 'KEXBORN.Stats.Law'}}</label>
                    <input type="number" name="system.bonuses.law" value="{{safeBonuses.law}}" style="width: 50px; height: 30px; text-align: center; font-weight: bold; font-size: 18px; border: 1px solid; background: transparent; border-radius: 3px;"/>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                    <label style="font-weight: bold; font-size: 14px; text-transform: uppercase;">{{localize 'KEXBORN.Stats.Culture'}}</label>
                    <input type="number" name="system.bonuses.culture" value="{{safeBonuses.culture}}" style="width: 50px; height: 30px; text-align: center; font-weight: bold; font-size: 18px; border: 1px solid; background: transparent; border-radius: 3px;"/>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                    <label style="font-weight: bold; font-size: 14px; text-transform: uppercase;">{{localize 'KEXBORN.Stats.Wealth'}}</label>
                    <input type="number" name="system.bonuses.wealth" value="{{safeBonuses.wealth}}" style="width: 50px; height: 30px; text-align: center; font-weight: bold; font-size: 18px; border: 1px solid; background: transparent; border-radius: 3px;"/>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                    <label style="font-weight: bold; font-size: 14px; text-transform: uppercase;">{{localize 'KEXBORN.Stats.Health'}}</label>
                    <input type="number" name="system.bonuses.health" value="{{safeBonuses.health}}" style="width: 50px; height: 30px; text-align: center; font-weight: bold; font-size: 18px; border: 1px solid; background: transparent; border-radius: 3px;"/>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                    <label style="font-weight: bold; font-size: 14px; text-transform: uppercase;">{{localize 'KEXBORN.Stats.Science'}}</label>
                    <input type="number" name="system.bonuses.science" value="{{safeBonuses.science}}" style="width: 50px; height: 30px; text-align: center; font-weight: bold; font-size: 18px; border: 1px solid; background: transparent; border-radius: 3px;"/>
                </div>
            </div>
        </div>
    </section>
</form>
